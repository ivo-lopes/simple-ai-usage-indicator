name: Validate extension
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GJS and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs gnome-shell gir1.2-secret-1 gir1.2-soup-3.0 libglib2.0-bin gettext unzip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install development linter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint GJS sources
        run: npm run lint
      - name: Validate syntax, schemas, tests, translations and ZIP
        run: ./scripts/validate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simple-ai-usage-indicator-${{ github.sha }}
          path: simple-ai-usage-indicator@ivo-lopes.github.com.shell-extension.zip
          if-no-files-found: error
          retention-days: 14
